name: Release
on:
  push:
    tags: ["v*"]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cargo test --release --locked

  build:
    needs: test
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-gnu, runner: ubuntu-latest, ext: "", artifact: "jabkit-linux-x86_64" }
          - { target: x86_64-pc-windows-gnu, runner: ubuntu-latest, ext: ".exe", artifact: "jabkit-windows-x86_64" }
          - { target: aarch64-apple-darwin, runner: macos-latest, ext: "", artifact: "jabkit-macos-aarch64" }
          - { target: x86_64-apple-darwin, runner: macos-latest, ext: "", artifact: "jabkit-macos-x86_64" }
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - run: rustup target add ${{ matrix.target }}
      - run: sudo apt-get update && sudo apt-get install -y mingw-w64
        if: contains(matrix.target, 'windows')
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Rename artifact
        run: |
          mv "target/${{ matrix.target }}/release/jabkit${{ matrix.ext }}" "${{ matrix.artifact }}${{ matrix.ext }}"
      - name: Generate checksum
        if: runner.os == 'Linux'
        run: sha256sum "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}${{ matrix.ext }}.sha256"
      - name: Generate checksum (macOS)
        if: runner.os == 'macOS'
        run: shasum -a 256 "${{ matrix.artifact }}${{ matrix.ext }}" > "${{ matrix.artifact }}${{ matrix.ext }}.sha256"
      - name: Generate checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: (Get-FileHash -Algorithm SHA256 "${{ matrix.artifact }}${{ matrix.ext }}").Hash.ToLower() + "  ${{ matrix.artifact }}${{ matrix.ext }}" | Out-File -FilePath "${{ matrix.artifact }}${{ matrix.ext }}.sha256" -Encoding ascii
      - name: Upload
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ${{ matrix.artifact }}${{ matrix.ext }}
            ${{ matrix.artifact }}${{ matrix.ext }}.sha256
          fail_on_unmatched_files: true
